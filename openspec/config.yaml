schema: spec-driven
context: |
  公共AI视频创作资料仓库；Python标准库工具、Markdown、JSON、CSV。
  docs放通用方法，works放作品事实；media不进普通Git。
  故事/观看/声音先行，区分史实、解读与虚构，保留已确认的创作约束。
  付费与云写逐项覆盖实际授权；历史报价不是新价，状态未知查原ID不自动重试。
  仅官方CLI操作即梦；图片默认内置imagegen，遵守具体作品的工具限制。
  本地测试、真实云操作、媒体/原速审片及创作者接受必须分别报告。
rules:
  tasks:
    - 每项任务写明可检查的交付或验收；文档不替代实际资源/工具实现。
